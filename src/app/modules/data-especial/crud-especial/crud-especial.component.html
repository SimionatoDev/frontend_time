<div class="div-barra">
  <mat-toolbar>
    <span class="example-spacer">Datas Especiais: </span>
    <app-navegator [controle]="controlePaginas" (changePage)="onChangePage()"></app-navegator>
    <button mat-icon-button class="example-icon" aria-label="Example icon-button with share icon"
      (click)="getDataEspecialContador()" matTooltip="Atualizar" matTooltipPosition="above">
      <mat-icon>rotate_right</mat-icon>
    </button>
    <button mat-icon-button aria-label="Example icon-button with share icon " matTooltipPosition="above"
      (click)="onSaveConfig()" matTooltip="Salvar Parâmetros" matTooltipPosition="above">
      <mat-icon>brightness_high</mat-icon>
    </button>
    <button mat-icon-button aria-label="Example icon-button with share icon " matTooltip="Retorno"
      matTooltipPosition="above" (click)="onHome()">
      <mat-icon>home</mat-icon>
    </button>
    <button mat-icon-button aria-label="Example icon-button with share icon "
      (click)="escolha(getAcoes()[ 'Inclusao']) " [matTooltip]="getTexto().incluir" matTooltipPosition="above">
      <mat-icon>add_circle_outline</mat-icon>
    </button>
  </mat-toolbar>
</div>

<app-filtro-datas-especiais  PARAMNAME = "paramespeciais" [HIDE]="hide" [EMAIL]="true" [DOWNLOAD]="true" [CONTROLE_PAGINAS]="controlePaginas" (changeParametro)="onChangeParametros($event)" (changeHide)="onChangeHide($event)"></app-filtro-datas-especiais>

<table class="Browse-Scroll">
  <thead>
    <tr>
      <th>Dt Inicial</th>
      <th>Dt Final</th>
      <th>Grupo</th>
      <th>Atividade</th>
      <th>Descrição</th>
      <th>Ações</th>
    </tr>
  </thead>
</table>

<cdk-virtual-scroll-viewport [itemSize]="50" class="content-scroll">
  <table class="Browse-Scroll">
    <tbody>
      <tr *cdkVirtualFor="let especial of especiais">
        <td>
          <div class="ellipsis" matTooltip="{{especial.dt_inicial}}">
            <mat-label class="Browse_Lanc_td">{{especial.dt_inicial}}</mat-label>
          </div>
        </td>
        <td>
          <div class="ellipsis" matTooltip="{{especial.dt_final}}">
            <mat-label class="Browse_Lanc_td">{{especial.dt_final}}</mat-label>
          </div>
        </td>
        <td>
          <div class="ellipsis" matTooltip="{{especial.grupo_descricao}}">
            <mat-label class="Browse_Lanc_td">{{especial.grupo_descricao.trim()}}</mat-label>
          </div>
        </td>
        <td>
          <div class="ellipsis" matTooltip="{{especial.atividade_descricao}}">
            <mat-label class="Browse_Lanc_td">{{especial.atividade_descricao.trim()}}</mat-label>
          </div>
        </td>
        <td>
          <div class="ellipsis" matTooltip="{{especial.descricao}}">
            <mat-label class="Browse_Lanc_td">{{especial.descricao.trim()}}</mat-label>
          </div>
        </td>
        <td>
          <barra-acoes [BARRA_ATIVIDADES]="false" [EXCLUIR]="false" (changeOpcao)="escolha($event, especial)">
          </barra-acoes>
        </td>
      </tr>
    </tbody>
  </table>
</cdk-virtual-scroll-viewport>
